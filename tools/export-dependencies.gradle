import groovy.json.JsonOutput

// Used only during delivery verification: no changes to the consumer app.
gradle.projectsEvaluated {
    rootProject.tasks.register('verifyNativeDependencies') {
        doLast {
            def packaged = rootProject.findProperty('usePackagedAar') == 'true'
            def raw = rootProject.name == 'SceneViewKotlin19AarCheck'
            def library = rootProject.project(raw ? ':app' : (packaged ? ':sample' : ':sceneview-native'))
            def configuration = (packaged || raw) ? 'debugRuntimeClasspath' : 'releaseRuntimeClasspath'
            def result = library.configurations.getByName(configuration).incoming.resolutionResult
            def failures = result.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }
            if (!failures.isEmpty()) throw new GradleException("Unresolved dependencies: ${failures}")
            def modules = result.allComponents.findAll { it.moduleVersion != null }.collect {
                def id = it.moduleVersion
                [group: id.group, name: id.name, version: id.version,
                 type: it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ? 'module' : 'project']
            }.unique().sort { "${it.group}:${it.name}" }
            def forbidden = modules.findAll {
                it.group.startsWith('androidx.compose') || it.group.startsWith('org.jetbrains.compose')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Forbidden UI dependency: ${forbidden}")
            def unexpectedFilament = modules.findAll {
                it.group == 'com.google.android.filament' && it.version != '1.72.1'
            }
            if (!unexpectedFilament.isEmpty()) throw new GradleException("Material/runtime mismatch: ${unexpectedFilament}")
            def report = rootProject.file(raw ? '../dist/raw-aar-dependencies.json' :
                (packaged ? 'dist/packaged-dependencies.json' : 'dist/dependencies.json'))
            report.parentFile.mkdirs()
            report.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: "${library.path}:${configuration}",
                resolved: true, noComposeArtifacts: true, modules: modules
            ])) + '\n'
            println "Verified ${modules.size()} resolved runtime artifacts; no Compose artifacts."
        }
    }
}
