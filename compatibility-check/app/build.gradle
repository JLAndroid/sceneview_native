plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'local.sceneview.sample'
    compileSdk 34
    defaultConfig {
        applicationId 'local.sceneview.kotlin19.aarcheck'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    sourceSets {
        main {
            manifest.srcFile '../../sample/src/main/AndroidManifest.xml'
            java.srcDirs = ['../../sample/src/main/java']
            res.srcDirs = ['../../sample/src/main/res']
            assets.srcDirs = ['../../sample/src/main/assets']
        }
    }
    androidResources { noCompress += ['glb'] }
}
// Reuse the exact configuration delivered for manual app/libs integration.
apply from: '../../tools/aar-dependencies.gradle'
